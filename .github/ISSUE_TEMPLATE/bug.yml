name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include secrets or private Synomem data. Report vulnerabilities privately through GitHub Security Advisories.
  - type: input
    id: version
    attributes:
      label: Synomem version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
      placeholder: Node 24.7.0 on macOS 26
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include sanitized commands, expected behavior, actual behavior, and reproduction steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste relevant `synomem doctor` output after removing private paths or data.
