name: Feature request
description: Propose a focused improvement
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or agent workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Storage, compatibility, and security impact
      description: Note any event schema, migration, MCP policy, privacy, or cross-platform implications.
